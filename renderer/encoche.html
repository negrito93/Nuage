<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- 'unsafe-eval' : le moteur de l'avatar (validateur ajv) compile ses schémas, comme dans index.html -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data: blob:">
<title>Nuage : encoche</title>
<link rel="stylesheet" href="encoche.css">
</head>
<body data-mode="barre" data-buddy="idle" data-tab="chat" data-view="chat">
  <!-- Mini-Nuage (pilule, pastilles, grille) : une seule forme, reprise par <use> -->
  <svg class="defs" width="0" height="0" aria-hidden="true">
    <defs id="skin-defs"></defs>
    <symbol id="mini" viewBox="0 0 32 22"><path class="body" d="M8 21a7 7 0 0 1-.9-13.95A9 9 0 0 1 24.4 6.6 7.2 7.2 0 0 1 24 21Z"/><g class="eyes"><ellipse cx="12.8" cy="14" rx="1.35" ry="2.1"/><ellipse cx="19.4" cy="14" rx="1.35" ry="2.1"/></g></symbol>
  </svg>

  <!-- Trait discret quand l'îlot est rentré dans le bord de l'écran -->
  <div class="wake" id="wake"></div>

  <div class="island" id="island">
    <div class="clip">
      <!-- Pilule : Nuage à gauche (le vrai, petit, de la couleur du temps) ; à droite, les pastilles actives (ou la météo) -->
      <div class="bar" id="bar">
        <span class="buddy" aria-hidden="true"><span class="buddy-avatar" id="buddy-avatar"></span><i class="buddy-badge"></i></span>
        <span class="status" id="status"></span>
        <span class="pill-right" id="pill-right"></span>
      </div>

      <!-- Panneau ouvert -->
      <div class="content" id="content">
        <header class="head" id="head">
          <nav class="tabs" role="tablist">
            <button type="button" role="tab" data-tab="agents" title="Accueil : ce que font tes agents"><svg viewBox="0 0 16 16"><path d="M7.3 1.9a1.1 1.1 0 0 1 1.4 0l5.4 4.4c.3.2.4.5.4.9v6.3c0 .6-.5 1.1-1.1 1.1h-2.8V10a.6.6 0 0 0-.6-.6H6a.6.6 0 0 0-.6.6v4.6H2.6c-.6 0-1.1-.5-1.1-1.1V7.2c0-.4.1-.7.4-.9Z"/></svg></button>
            <button type="button" role="tab" data-tab="chat" class="on" title="Chat"><svg viewBox="0 0 16 16"><path d="M3.4 2.2h9.2a2 2 0 0 1 2 2v5.4a2 2 0 0 1-2 2H8.2l-3.5 2.6c-.4.3-.9 0-.9-.5v-2.1h-.4a2 2 0 0 1-2-2V4.2a2 2 0 0 1 2-2Z"/></svg></button>
            <button type="button" class="tab-new" id="new-chat" title="Nouvelle session Claude Code"><svg viewBox="0 0 16 16" class="stroke"><path d="M8 3v10M3 8h10"/></svg></button>
          </nav>
          <span class="grow"></span>
          <button type="button" class="plan" id="usage-head" title="Limites d’utilisation de Claude" hidden></button>
          <span class="running" id="running"></span>
          <button type="button" class="hbtn" id="mic-btn" title="« Hey Nuage »"><svg viewBox="0 0 16 16"><rect x="5.3" y="1.5" width="5.4" height="8.6" rx="2.7"/><path class="stroke" d="M3.3 7.6a4.7 4.7 0 0 0 9.4 0M8 12.4v2.1"/><path class="mute stroke" d="M2.4 2.4l11.2 11.2"/></svg></button>
          <button type="button" class="hbtn" id="cnx-btn" title="Réglages"><svg viewBox="0 0 16 16"><path d="M6.9 1.2h2.2l.4 1.8c.4.1.8.3 1.1.5l1.6-1 1.6 1.6-1 1.6c.2.4.4.7.5 1.1l1.8.4v2.2l-1.8.4c-.1.4-.3.8-.5 1.1l1 1.6-1.6 1.6-1.6-1c-.4.2-.7.4-1.1.5l-.4 1.8H6.9l-.4-1.8c-.4-.1-.8-.3-1.1-.5l-1.6 1-1.6-1.6 1-1.6c-.2-.4-.4-.7-.5-1.1l-1.8-.4V6.9l1.8-.4c.1-.4.3-.8.5-1.1l-1-1.6 1.6-1.6 1.6 1c.4-.2.7-.4 1.1-.5ZM8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8Z"/></svg></button>
          <button type="button" class="hbtn" id="sound-btn" title="Sons"><svg viewBox="0 0 16 16"><path d="M2 6.1c0-.4.3-.7.7-.7h2.1L8 2.8c.4-.3 1-.1 1 .5v9.4c0 .6-.6.8-1 .5L4.8 10.6H2.7a.7.7 0 0 1-.7-.7Z"/><path class="wave stroke" d="M11 5.7a3.3 3.3 0 0 1 0 4.6M12.9 3.9a5.9 5.9 0 0 1 0 8.2"/><path class="mute stroke" d="M11 6.2l3.6 3.6M14.6 6.2 11 9.8"/></svg></button>
        </header>

        <div class="deck" id="deck">
          <!-- Nuage : un seul personnage, qui se déplace d'une vue à l'autre (comme chez Coucou) -->
          <div class="bot" id="bot">
            <i class="halo"></i>
            <svg class="mini-bot" viewBox="0 0 32 22" aria-hidden="true"><use href="#mini"/></svg>
            <div class="bot-avatar" id="bot-avatar"></div>
            <span class="bot-badge" id="bot-badge"></span>
          </div>
          <!-- Sous Nuage dans le détail d'une étape : la session et ses étapes -->
          <div class="side-info" id="side-info"></div>

          <div class="views">
            <!-- Accueil : la session suivie (carte de gauche), les pastilles (carte de droite) -->
            <section class="view" id="pane-agents">
              <div class="card wash" id="home-left"></div>
              <div class="card" id="home-right"></div>
            </section>

            <section class="view on" id="pane-chat">
              <div class="card wash chat-card">
                <div class="toast-line" id="toast-line" hidden></div>
                <div class="chat-top">
                  <button type="button" class="model-btn" id="model-btn" title="Changer de session, d'IA ou de modèle"><i class="model-dot"></i><span id="model-label">Claude</span><svg viewBox="0 0 16 16"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg></button>
                  <button type="button" class="ghost" id="leave-session" title="Quitter la session : discussion sans session" hidden><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
                </div>
                <div class="keyhint" id="keyhint" hidden></div>
                <div class="chat-log" id="messages" aria-live="polite"></div>
                <div class="perm" id="chat-perm" hidden></div>
                <div class="chip-row" id="attachments"></div>
                <form class="chat-bar" id="composer">
                  <button type="button" class="clip-btn" id="pick" title="Joindre un fichier"><svg viewBox="0 0 16 16"><path d="M10.5 4.5 5.8 9.2a1.4 1.4 0 0 0 2 2l5-5a2.8 2.8 0 0 0-4-4l-5 5a4.2 4.2 0 0 0 6 6l4.2-4.2"/></svg></button>
                  <textarea id="input" rows="1" placeholder="Demande-moi n’importe quoi…"></textarea>
                  <button type="button" class="clip-btn" id="talk" title="Parler (ou dis « Hey Nuage », ou Ctrl+Alt+H) : la réponse est lue à voix haute"><svg viewBox="0 0 16 16"><rect x="5.6" y="1.8" width="4.8" height="8" rx="2.4"/><path d="M3.4 7.6a4.6 4.6 0 0 0 9.2 0M8 12.2v2"/></svg></button>
                  <button type="submit" class="send-btn" id="send" title="Envoyer (Entrée)"><svg viewBox="0 0 16 16"><path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2"/></svg></button>
                  <button type="button" class="send-btn stop" id="stop" title="Arrêter la réponse" hidden><svg viewBox="0 0 16 16"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5"/></svg></button>
                </form>
                <div class="menu" id="model-menu" hidden></div>
              </div>
            </section>

            <!-- Autorisation, question, fin de session, « trop de clics » : une carte à la fois -->
            <section class="view" id="pane-alert"><div class="card wash" id="alert-card"></div></section>

            <section class="view" id="pane-telephone"><div class="card"><div class="scroll" id="telephone"></div></div></section>
            <!-- Réglages : tous ceux de Nuage (roue dentée de l'en-tête ; renderer/reglages.js) -->
            <section class="view" id="pane-reglages"><div class="card"><div class="scroll" id="reglages"></div></div></section>
            <section class="view" id="diff"></section>
          </div>
          <div class="sparkles" id="sparkles" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Fichier glissé sur l'îlot -->
      <div class="drop" id="drop" hidden>
        <div class="drop-target" data-target="chat"><svg class="frame" preserveAspectRatio="none"><rect x="1" y="1" rx="15"/></svg><b class="with-ico" data-icon="chat-circle-dots">Demander à l’IA</b><small>Joindre au chat</small></div>
        <div class="drop-target" data-target="email"><svg class="frame" preserveAspectRatio="none"><rect x="1" y="1" rx="15"/></svg><b class="with-ico" data-icon="envelope-simple">Par e-mail</b><small>L’envoyer</small></div>
        <div class="drop-target" data-target="swallow"><svg class="frame" preserveAspectRatio="none"><rect x="1" y="1" rx="15"/></svg><b class="with-ico" data-icon="trash">Donner à Nuage</b><small>À la corbeille (annulable)</small></div>
        <div class="drop-target" data-target="phone"><svg class="frame" preserveAspectRatio="none"><rect x="1" y="1" rx="15"/></svg><b class="with-ico" data-icon="device-mobile">Au téléphone</b><small>Dans Nuage de poche</small></div>
        <!-- Nuage glouton : il vole vers la case visée, ouvre la bouche, avale le fichier ; l'avaler lance l'action -->
        <div class="eater" id="eater" aria-hidden="true">
          <svg viewBox="0 0 32 24"><path class="e-body" d="M8 22a7 7 0 0 1-.9-13.95A9 9 0 0 1 24.4 7.6 7.2 7.2 0 0 1 24 22Z"/><g class="e-cheeks"><ellipse cx="10.4" cy="17.4" rx="1.6" ry=".9"/><ellipse cx="21.9" cy="17.4" rx="1.6" ry=".9"/></g><g class="e-eyes" id="eater-eyes"><ellipse cx="13" cy="13.6" rx="1.3" ry="1.95"/><ellipse cx="19.2" cy="13.6" rx="1.3" ry="1.95"/></g><ellipse class="e-mouth" cx="16.1" cy="18.2" rx="2" ry="1.9"/></svg>
        </div>
        <div class="morsel" id="morsel" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <script src="nuage.avatar.js"></script>
  <script type="module" src="encoche.js"></script>
</body>
</html>
